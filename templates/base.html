<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice App{% endblock %}</title>
  <script>
    // restore sidebar state before the page paints (closed by default on phones)
    try {
      var saved = localStorage.getItem('sidebar');
      if (saved === 'closed' || (saved === null && window.innerWidth < 768)) {
        document.documentElement.classList.add('collapsed');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css">
  <style>
    /* ---------- dark theme ---------- */
    html, body { background: #0f0f10; color: #e6e6e6; min-height: 100vh; }
    a { color: #4da3ff; }
    .ui.header { color: #fff; }
    .ui.dividing.header { border-bottom-color: #333; }

    /* ---------- sidebar ---------- */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 230px;
      background: #000; border-right: 1px solid #2a2a2a; padding: 1.2rem .8rem;
      z-index: 1000; transition: transform .25s ease;
    }
    html.collapsed .sidebar { transform: translateX(-100%); }

    /* toggle button: fixed at top-left so it sits inside the sidebar (before the brand)
       and stays in the same place when the sidebar is closed */
    #sidebarToggle {
      position: fixed; top: 1.1rem; left: .8rem; z-index: 1100;
      background: transparent; color: #fff; border: 1px solid #333; border-radius: 8px;
      width: 38px; height: 38px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #sidebarToggle:hover { background: #1c1c1d; }
    #sidebarToggle i.icon { margin: 0; font-size: 1.1rem; }
    .sidebar .brand {
      color: #fff; font-size: 1.25rem; font-weight: 700;
      padding: .4rem .6rem 1.4rem 3.2rem; display: flex; align-items: center; gap: .6rem;
    }
    .sidebar .ui.vertical.menu { width: 100%; background: transparent; border: none; box-shadow: none; }
    .sidebar .ui.vertical.menu .item { color: #aaa; border-radius: 8px; margin-bottom: .3rem; }
    .sidebar .ui.vertical.menu .item:before { display: none; }
    .sidebar .ui.vertical.menu .item > i.icon { float: none; margin: 0 .7rem 0 0; }
    .sidebar .ui.vertical.menu .item:hover { background: #1c1c1d; color: #fff; }
    .sidebar .ui.vertical.menu .active.item { background: #2185d0; color: #fff; }

    /* ---------- page area ---------- */
    .page { margin-left: 230px; padding: 2rem 2.5rem 2rem; transition: margin-left .25s ease; }
    html.collapsed .page { margin-left: 0; padding-top: 4.5rem; }
    .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .page-head .ui.header { margin: 0; }
    @media (max-width: 768px) {
      .page, html.collapsed .page { margin-left: 0; padding: 4.5rem 1rem 1rem; }
    }

    /* ---------- dialogs (modals) ---------- */
    .ui.modal { background: #1b1c1d; color: #ddd; }
    .ui.modal > .header { background: #1b1c1d; color: #fff; border-bottom: 1px solid #333; }
    .ui.modal > .content { background: #1b1c1d; color: #ddd; }
    .ui.modal > .actions { background: #151516; border-top: 1px solid #333; }
    .ui.modal .cancel.button { background: #333; color: #fff; }

    /* ---------- form fields ---------- */
    .ui.form input, .ui.form textarea, .ui.form select {
      background: #262728 !important; color: #fff !important;
      border: 1px solid #3d3e3f !important; color-scheme: dark;
    }
    .ui.form input:focus, .ui.form textarea:focus, .ui.form select:focus {
      border-color: #2185d0 !important; background: #2d2e2f !important;
    }
    .ui.form .field > label { color: #ccc !important; }
    .req { color: #ff5a52; }

    /* ---------- flash messages ---------- */
    .ui.message { box-shadow: none; }
    .ui.positive.message { background: #16351f; color: #7ee2a8; border: 1px solid #2d6a4a; }
    .ui.negative.message { background: #3b1a1a; color: #ff9b95; border: 1px solid #7a2e2e; }
    .ui.warning.message  { background: #3a2f12; color: #f5d27a; border: 1px solid #7a6420; }
    .ui.warning.message a { color: #ffd166; text-decoration: underline; }
  </style>
</head>
<body>

<!-- MENU BUTTON (shows/hides the sidebar) -->
<button type="button" id="sidebarToggle" title="Show / hide menu"><i class="bars icon"></i></button>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand"><i class="file alternate icon"></i> Invoice App</div>
  <div class="ui inverted vertical menu">
    <a class="item {{ 'active' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">
      <i class="th large icon"></i> Dashboard</a>
    <a class="item {{ 'active' if request.endpoint == 'invoices' }}" href="{{ url_for('invoices') }}">
      <i class="file alternate outline icon"></i> Invoices</a>
    <a class="item {{ 'active' if request.endpoint == 'customers' }}" href="{{ url_for('customers') }}">
      <i class="users icon"></i> Customers</a>
    <a class="item {{ 'active' if request.endpoint == 'items' }}" href="{{ url_for('items') }}">
      <i class="cubes icon"></i> Items</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="page">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="ui {{ category }} message"><i class="close icon"></i>{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<!-- Shared "are you sure?" dialog used by every delete button -->
<div class="ui mini modal" id="deleteModal">
  <div class="header">Confirm delete</div>
  <div class="content"><p id="deleteText">Are you sure?</p></div>
  <div class="actions">
    <form method="post" id="deleteForm" style="display:inline">
      <button type="button" class="ui cancel button">Cancel</button>
      <button type="submit" class="ui red button">Delete</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js"></script>
<script>
  // close (x) on flash messages
  $('.message .close').on('click', function () {
    $(this).closest('.message').transition('fade');
  });

  // show / hide the sidebar and remember the choice
  $('#sidebarToggle').on('click', function () {
    const closed = document.documentElement.classList.toggle('collapsed');
    try { localStorage.setItem('sidebar', closed ? 'closed' : 'open'); } catch (e) {}
  });

  // open the delete dialog: url = POST endpoint, text = message to show
  function confirmDelete(url, text) {
    $('#deleteForm').attr('action', url);
    $('#deleteText').text(text);
    $('#deleteModal').modal('show');
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
